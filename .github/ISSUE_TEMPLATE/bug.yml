name: Bug Report
description: >-
  Something isn't working as expected. Never paste pupil data, answers from
  the pupil tracking system (LVS) or log lines with names: describe what
  happened instead.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, build, anything else that might be relevant.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: >-
        Logs, screenshots, links to related issues. No passwords, 2FA keys,
        pupil data, LVS answers or log lines with names: describe what
        happened instead.
