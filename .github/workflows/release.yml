name: Release

# Pushing a tag vX.Y.Z builds the Claude Desktop extension and publishes it
# as a full GitHub release (not a draft or pre-release: the update check asks
# for /releases/latest) with the stable asset names smartschool-mcp.mcpb and
# smartschool-mcp.exe (the server itself, which installs itself for ChatGPT
# and Codex when double-clicked).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # The tag, through the environment rather than pasted into the scripts.
      TAG: ${{ github.ref_name }}
      MCPB: '@anthropic-ai/mcpb@2.1.2'
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Check that the tag matches the version
        run: dart run tool/check_version.dart --tag "$env:TAG"
      - name: Test
        run: dart test
      - name: Build the extension folder
        # manifest.json, icon.png, LICENSE and the server compiled with
        # dart compile exe into bundle/server/smartschool-mcp.exe.
        run: dart run tool/build_bundle.dart bundle
      - name: Validate the manifest
        run: npx --yes "$env:MCPB" validate bundle/manifest.json
      - name: Pack the extension
        run: npx --yes "$env:MCPB" pack bundle smartschool-mcp.mcpb
      - name: Publish the release
        # The notes start with .github/release-notes.md (how to install, with
        # links to the colleague guides); gh puts the generated notes after
        # it. The exe is the one in the extension, under its own name.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:TAG" smartschool-mcp.mcpb
          bundle/server/smartschool-mcp.exe
          --title "$env:TAG" --notes-file .github/release-notes.md
          --generate-notes --verify-tag
